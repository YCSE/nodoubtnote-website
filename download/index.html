<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>앱 다운로드 - 노답노트</title>
  <meta name="description" content="노답노트 앱을 App Store 또는 Google Play에서 무료로 다운로드하세요.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#FF6B35">

  <!-- Favicon -->
  <link rel="icon" href="/assets/appicon.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/assets/appicon.webp">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/styles.css">

  <style>
    .download-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
      text-align: center;
      background: var(--color-bg);
    }

    .download-icon {
      width: 108px;
      height: 108px;
      margin-bottom: var(--space-lg);
      border-radius: 30px;
      box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
    }

    .download-title {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      font-weight: var(--font-weight-black);
      letter-spacing: -0.03em;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .download-message {
      font-size: 1.05rem;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-xl);
    }

    .download-stores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .download-home {
      margin-top: var(--space-xl);
      font-size: 0.95rem;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <main class="download-container">
    <img src="/assets/appicon.webp" alt="노답노트" class="download-icon">
    <h1 class="download-title">노답노트</h1>
    <p class="download-message" id="download-message" aria-live="polite">기기에 맞는 스토어를 선택하세요</p>

    <div class="download-stores">
      <a href="https://apps.apple.com/kr/app/%EB%85%B8%EB%8B%B5%EB%85%B8%ED%8A%B8/id6757139844" class="btn btn-ios" data-store="ios" aria-label="App Store에서 다운로드">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        <span class="btn-text">App Store</span>
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.ycse.nodoubtnote" class="btn btn-android" data-store="android" aria-label="Google Play에서 다운로드">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
        </svg>
        <span class="btn-text">Google Play</span>
      </a>
    </div>

    <a href="/" class="download-home footer-link">노답노트 홈으로</a>
  </main>

  <script>
    // Redirect phones straight to their store; desktops see both buttons.
    // Keep in sync with detectPlatform() in /script.js
    (function() {
      var ua = navigator.userAgent || '';
      var platform = null;
      if (/android/i.test(ua)) {
        platform = 'android';
      } else if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
        platform = 'ios';
      }
      if (!platform) return;

      var link = document.querySelector('[data-store="' + platform + '"]');
      if (!link) return;
      document.getElementById('download-message').textContent = '스토어로 이동하고 있어요…';
      window.location.replace(link.href);
    })();
  </script>
</body>
</html>
